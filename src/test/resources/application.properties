# Test configuration
spring.application.name=abrantes-test

# Database (H2)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Security
api.security.token.secret=test-secret-key-must-be-long-enough-for-hmac256-so-adding-more-chars
admin.default.username=admin
admin.default.password=Str0ngP@ssw0rd!

# Mail (Dummy)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=test
spring.mail.password=test
spring.mail.from=noreply@test.com
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
